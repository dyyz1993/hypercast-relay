[package]
name = "hypercast-protocol-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hypercast 纯函数协议库（签名 transcript / 邮箱派生 / 版本与能力位）"

[dependencies]
# 设计约束: 纯函数 crate, 禁止 tokio/IO/UI 依赖。
# ring 仅用于 SHA-256 摘要(纯计算, 全平台可用)。
ring = "0.17"

[dev-dependencies]
serde_json = "1"
